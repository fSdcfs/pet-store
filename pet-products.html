<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pet-products</title>
  <link rel="stylesheet" href="css-sytle.css">

<body>
  <header>
    <h1>paws</h1>
  </header>

  <div id="cart" class="cart-box">
    <h2>Your Cart</h2>
    <ul id="cart-items"></ul>
  </div>
 <form id="checkout-form">
  <h2>Checkout Details</h2>
  <input type="text" id="name" placeholder="Full Name" required />
  <input type="text" id="address" placeholder="Delivery Address" required />
  <select id="payment" required>
    <option value="" disabled selected>Select Payment Method</option>
    <option value="UPI">UPI</option>
    <option value="Cash on Delivery">Cash on Delivery</option>
    <option value="Credit Card">Credit Card</option>
  </select>
  <button type="submit">Place Order</button>
</form>


  <section class="product-grid">
    <div class="product">
      <img src="" alt="Product 1" />
      <h3>Product 1</h3>
      <p>₹499</p>
      <button class="add-to-cart" data-name="Product 1" data-price="499">Add to Cart</button>
    </div>
    <div class="product">
      <img src="" alt="Product 2" />
      <h3>Product 2</h3>
      <p>₹799</p>

      <img src="" alt="Product 3" />

      <p>₹999</p>
      <button class="add-to-cart" data-name="Product 3" data-price="999">Add to Cart</button>
    </div>
    <div class="product">
      <img src="" alt="Product 4" />
      <h3>Product 4</h3>

      <button class="add-to-cart" data-name="Product 4" data-price="499">Add to Cart</button>
    </div>
    <div class="product">
      <img src="" alt="Product 5" />

      <p>₹799</p>
      <button class="add-to-cart" data-name="Product 5" data-price="799">Add to Cart</button>
    </div>
    <div class="product">
      <img src="pedigree pic.jpg" alt="Product 6" />
      <h3>Product 6</h3>
      <p>₹999</p>
      <button class="add-to-cart" data-name="Product 6" data-price="999">Add to Cart</button>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 My Online Store</p>
  </footer>




  <script src="homeand all pages.js"></script>
